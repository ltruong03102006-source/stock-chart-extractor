<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Chart Extractor - Side Panel</title>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-blue: #38bdf8;
        --accent-green: #4ade80;
        --accent-amber: #fbbf24;
        --border-color: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        padding: 12px;
        font-size: 13px;
        line-height: 1.5;
      }
      header {
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .badge-synced {
        background-color: rgba(74, 222, 128, 0.2);
        color: var(--accent-green);
      }
      .badge-syncing {
        background-color: rgba(251, 191, 36, 0.2);
        color: var(--accent-amber);
      }
      .card {
        background-color: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat-item {
        background-color: var(--bg-tertiary);
        padding: 8px;
        border-radius: 6px;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text-secondary);
      }
      .stat-value {
        font-size: 16px;
        font-weight: 700;
        color: var(--accent-blue);
      }
      .drawing-list {
        max-height: 180px;
        overflow-y: auto;
      }
      .drawing-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border-color);
        font-size: 12px;
      }
      .drawing-item:last-child {
        border-bottom: none;
      }
      pre {
        background-color: #030712;
        color: #38bdf8;
        padding: 10px;
        border-radius: 6px;
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        max-height: 260px;
        overflow: auto;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <header>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 15px; font-weight: 700;">Stock Chart Extractor</h2>
        <span id="sync-badge" class="badge badge-syncing">Initializing</span>
      </div>
      <div style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">
        Platform: <strong>FireAnt</strong> &bull; MV3 Side Panel
      </div>
    </header>

    <div class="card">
      <div class="card-title">Chart Information</div>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-label">Symbol</div>
          <div id="stat-symbol" class="stat-value">---</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Drawings</div>
          <div id="stat-count" class="stat-value">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Detected Drawings</div>
      <div id="drawing-list" class="drawing-list">
        <div style="color: var(--text-secondary); text-align: center; padding: 12px;">
          Waiting for FireAnt Chart data...
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Live Normalized JSON</div>
      <pre id="json-viewer">// JSON will automatically sync here in real-time</pre>
      <div class="actions">
        <button id="btn-copy">Copy JSON</button>
        <button id="btn-sync" style="background-color: var(--bg-tertiary);">Request Sync</button>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
